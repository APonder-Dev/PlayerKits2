name: Release

# Publishes a GitHub Release whenever pom.xml's <version> on main doesn't already
# have a matching release. The version number itself is entirely author-controlled -
# bump it in pom.xml (and note the change in the commit) whenever you want a new
# release to go out; this workflow just keeps the Releases page and jar in sync
# with whatever version is current.

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'src/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Read project version
        id: version
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: mvn -B clean package

      - name: Locate build jar
        if: steps.check.outputs.exists == 'false'
        id: jar
        run: |
          JAR="target/PlayerKits2-${{ steps.version.outputs.version }}.jar"
          if [ ! -f "$JAR" ]; then
            echo "Expected jar not found: $JAR" >&2
            ls -la target/*.jar >&2 || true
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.jar.outputs.path }}
